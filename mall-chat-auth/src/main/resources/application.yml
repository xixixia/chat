server:
  port: 8081

spring:
  application:
    name: mall-chat-auth
  datasource:
    url: jdbc:mysql://localhost:3306/mall_chat?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: mall-chat-auth
        heartbeat:
          enabled: true
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: mall-chat-auth-default-secret-32
    expire-minutes: 120
  qq:
    app-id: your-qq-app-id
    app-key: your-qq-app-key
    redirect-uri: http://localhost:5173/auth/qq-callback
    scope: get_user_info
  cos:
    secret-id: your-cos-secret-id
    secret-key: your-cos-secret-key
    app-id: your-cos-app-id
    region: ap-guangzhou
    bucket: your-bucket-name
    domain: https://your-cdn-domain
    prefix: avatars/
    sts-duration-seconds: 1800
    max-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp,image/gif
